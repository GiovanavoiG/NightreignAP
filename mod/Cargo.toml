[package]
name = "nightreign-archipelago"
version = "0.1.0"
edition = "2021"
description = "Archipelago multiworld client for Elden Ring: Nightreign, loaded by Mod Engine 3"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "nightreign_archipelago"

[dependencies]
# Same stack as fswap/from-software-archipelago-clients (DS3 4.x) and 4laric/er-archipelago.
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", package = "fromsoftware-shared" }
nightreign        = { git = "https://github.com/vswarte/fromsoftware-rs", package = "nightreign" }
archipelago_rs    = "2.1"
ilhook            = "2.3"
hudhook           = { version = "0.9", features = ["dx12"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices",
    "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
once_cell = "1"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
debug = 1
panic = "abort"
